<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>POS — Register</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>🛒 Create Account</h1>
      <div id="alert" class="alert"></div>
      <div class="field"><label>Name</label><input id="name" placeholder="Your name"/></div>
      <div class="field"><label>Email</label><input type="email" id="email" placeholder="you@email.com"/></div>
      <div class="field"><label>Password</label><input type="password" id="password" placeholder="Min 6 characters"/></div>
      <button class="btn btn-primary" id="registerBtn">Create Account</button>
      <p style="text-align:center;margin-top:1rem;font-size:.85rem;color:var(--muted)">
        Already have an account? <a href="index.html">Login</a>
      </p>
    </div>
  </div>
  <script type="module" src="js/register.js"></script>
</body>
</html>
