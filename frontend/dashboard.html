<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>POS — Cashier</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

  <nav class="navbar">
    <h2>🛒 POS — Cashier</h2>
    <div style="display:flex;align-items:center;gap:1rem">
      <span id="cashierName"></span>
      <span id="adminLink" style="display:none">
        <a href="admin.html" style="font-size:.875rem">⚙️ Admin</a>
      </span>
      <button class="btn btn-sm btn-danger" id="logoutBtn">Logout</button>
    </div>
  </nav>

  <div class="container grid-2">

    <!-- Left: Products -->
    <div>
      <input class="search-bar" id="searchInput" placeholder="Search products…" />
      <div class="product-grid" id="productGrid">
        <p style="color:var(--muted)">Loading products…</p>
      </div>
    </div>

    <!-- Right: Cart -->
    <div class="card">
      <h3>Cart</h3>
      <div id="cartItems">
        <p style="color:var(--muted);font-size:.875rem">No items yet. Click a product to add.</p>
      </div>
      <div class="cart-total" id="cartTotal" style="display:none">Total: ₦0.00</div>
      <br/>
      <div id="alert" class="alert"></div>
      <button class="btn btn-success" id="checkoutBtn" style="width:100%;display:none">
        ✅ Checkout
      </button>
    </div>

  </div>

  <!-- Receipt Modal -->
  <div class="modal-overlay" id="receiptModal">
    <div class="modal">
      <div class="receipt-header">
        <h2>🛒 POS System</h2>
        <p id="receiptDate"></p>
        <p id="receiptCashier"></p>
      </div>
      <table class="receipt-items" id="receiptItems"></table>
      <div class="receipt-total" id="receiptTotal"></div>
      <div class="receipt-footer">Thank you for your purchase!</div>
      <div style="display:flex;gap:.5rem;margin-top:1rem" class="no-print">
        <button class="btn btn-primary" style="flex:1" onclick="window.print()">🖨️ Print</button>
        <button class="btn" style="flex:1;background:var(--border)" id="closeReceipt">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
